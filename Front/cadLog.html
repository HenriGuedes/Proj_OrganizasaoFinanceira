<!doctype html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Criar conta - Controle Financeiro</title>
  <link rel="stylesheet" href="/Proj_OrganizasaoFinanceira/Front/cadLog.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
</head>

<body>
  <main class="register-container">
    <header class="register-header">
      <div class="logo-icon" aria-hidden="true">💰</div>
      <h1>Crie sua conta</h1>
      <p>Comece a organizar suas finanças pessoais</p>
    </header>

    <form class="register-form" id="formCadastro">
      <div class="input-group">
        <label for="nome">Nome</label>
        <input type="text" id="nome" name="nome" placeholder="Como podemos te chamar?" autocomplete="name" required />
      </div>

      <div class="input-group">
        <label for="emailCadastro">E-mail</label>
        <input type="email" id="emailCadastro" name="email" placeholder="seu@email.com" autocomplete="email" required />
      </div>

      <div class="input-group">
        <label for="senhaCadastro">Senha</label>
        <input type="password" id="senhaCadastro" name="senha" placeholder="Crie uma senha" autocomplete="new-password"
          minlength="8" required />
        <small class="field-hint">Use pelo menos 8 caracteres.</small>
      </div>

      <div class="input-group">
        <label for="confirmarSenha">Confirmar senha</label>
        <input type="password" id="confirmarSenha" name="confirmarSenha" placeholder="Digite a senha novamente"
          autocomplete="new-password" minlength="8" required />
      </div>

      <button type="submit" class="btn-register">Criar conta</button>
    </form>

    <footer class="register-footer">
      <p>Já tem uma conta? <a href="./login.html">Entrar</a></p>
    </footer>
  </main>
</body>
<script src="./cadLog.js"></script>

</html>
